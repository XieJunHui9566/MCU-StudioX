# AG32VF303CCT6 / AGM BLASTER DAP mode; requires AGM's patched OpenOCD.
# Derived from AgRV_pio 1.8.10 platforms/AgRV/etc/agrv2k.cfg; see provenance.md.
# StudioX selects interface/cmsis-dap.cfg, SWD, adapter speed and serial before use.
source [find target/swj-dp.tcl]
source [find mem_helper.tcl]
set _CHIPNAME agrv2k
set _TARGETNAME cpu
swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_TARGETNAME riscv -endian little -dap $_CHIPNAME.dap
$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size 0x10000 -work-area-backup 1
$_TARGETNAME configure -gdb-max-connections 1
riscv virt2phys_mode off
riscv set_mem_access sysbus progbuf
riscv hide_csrs 7,21,23
riscv hide_csrs 65-767
riscv hide_csrs 774-831
riscv hide_csrs 837-1951
riscv hide_csrs 1955-1967
riscv hide_csrs 1971-2815
riscv hide_csrs 2819-2937
riscv hide_csrs 2947-4095
# Auto-detect physical capacity. No ROM, logic or option-byte programming bank.
flash bank $_CHIPNAME.FLASH agrv 0x80000000 0 0 0 $_TARGETNAME
gdb report_data_abort enable

proc studiox_check_target {} {
    if {[string first "read protection: on" [agrv options_read]] >= 0} {
        error "AG32 read protection enabled; automatic unlock is not allowed"
    }
    set id [lindex [read_memory 0x03000100 32 1] 0]
    if {$id != 0x40200001} { error "Expected AG32VF303CCT6 device ID 0x40200001" }
    flash probe 0
    set bank [lindex [flash list] 0]
    if {[dict get $bank base] != 0x80000000 || [dict get $bank size] != 0x40000} {
        error "Expected AG32 256 KiB physical Flash"
    }
    # This preview supports the established 156 KiB app + 100 KiB logic layout.
    # Never infer a safe firmware range for a different or compressed VE layout.
    set logic [read_memory 0x81000030 32 2]
    if {[lindex $logic 0] != 0x80027000 || [lindex $logic 1] != 0x7ffd8fff} {
        error "AG32 logic layout differs: this pack requires uncompressed logic at 0x80027000; no write performed"
    }
}

# Freeze watchdog/low-power debug behaviour only for this GDB session; restore it on detach.
$_TARGETNAME configure -event gdb-attach {
    halt
    if {![info exists ::STUDIOX_AG32_DEBUG_CONTROL]} {
        set ::STUDIOX_AG32_DEBUG_CONTROL [mrw 0x0300001c]
    }
    mmw 0x0300001c 0xf 0
    poll on
}
proc studiox_ag32_detach {} {
    if {[info exists ::STUDIOX_AG32_DEBUG_CONTROL]} {
        mww 0x0300001c $::STUDIOX_AG32_DEBUG_CONTROL
        unset ::STUDIOX_AG32_DEBUG_CONTROL
    }
    poll on
}
# The IDE installs the same verified resume handler when it starts its session.
$_TARGETNAME configure -event gdb-detach {
    studiox_ag32_detach
    resume
    poll
    if {[[target current] curstate] ne "running"} { error "Target did not resume" }
    echo STUDIOX_DETACHED_RUNNING
}
