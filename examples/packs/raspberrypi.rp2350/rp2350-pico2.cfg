# 当前配置对应 RP2350A / Pico 2 兼容板，4 MiB 外置 Flash。
# WCH CMSIS-DAP 实测需要显式 TARGETSEL；在加载目标脚本前启用。
set SWD_MULTIDROP 1
set USE_CORE { cm0 cm1 }
source [find target/rp2350.cfg]
# IDE 对主核设置事件；两核保持 OpenOCD 的 SMP 联合停机配置。
set _TARGETNAME $_TARGETNAME_CM0

proc studiox_check_target {} {
    set chip [lindex [read_memory 0x40000000 32 1] 0]
    if {($chip & 0x0fffffff) != 0x00004927} {
        error "Target mismatch: expected RP2350; Flash unchanged"
    }
    # OpenOCD 的 Flash 探测使用 Boot ROM / SRAM 算法；保留工作区，完成后还原。
    flash probe 0
    set banks [flash list]
    array set bank [lindex $banks 0]
    if {$bank(base) != 0x10000000 || $bank(size) != 0x400000} {
        error "Flash size mismatch: Pico 2 profile requires 4 MiB; Flash unchanged"
    }
}

proc studiox_rp2350_readonly {} {
    global _TARGETNAME_CM0 _TARGETNAME_CM1
    # Flash 已探测；固件比较不得再在应用 SRAM 中运行 CRC 算法。
    $_TARGETNAME_CM0 configure -work-area-size 0 -work-area-backup 1
    $_TARGETNAME_CM1 configure -work-area-size 0 -work-area-backup 1
}

proc studiox_rp2350_detach {} {
    global _TARGETNAME_CM0 _TARGETNAME_CM1
    foreach core [list $_TARGETNAME_CM0 $_TARGETNAME_CM1] {
        targets $core
        cortex_m vector_catch none
    }
    targets $_TARGETNAME_CM0
    resume
    poll
    foreach core [list $_TARGETNAME_CM0 $_TARGETNAME_CM1] {
        if {[$core curstate] ne "running"} { error "RP2350 core did not resume: $core" }
    }
    echo STUDIOX_DETACHED_RUNNING
}
