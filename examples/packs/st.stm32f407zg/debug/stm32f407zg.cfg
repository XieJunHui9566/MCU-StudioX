# StudioX target profile. Interface/transport are selected by the IDE.
source [find target/stm32f4x.cfg]

# 避免通用目标脚本在 reset init 时覆盖用户选择的 SWD 速度。
$_TARGETNAME configure -event reset-init {}
$_TARGETNAME configure -event reset-start {}

proc studiox_check_target {} {
    set silicon [expr {[lindex [read_memory 0xE0042000 32 1] 0] & 0xFFF}]
    set flash_kb [lindex [read_memory 0x1FFF7A22 16 1] 0]
    if {$silicon != 0x413 || $flash_kb != 1024} {
        error [format {Target mismatch: expected STM32F405/407 family, 1024 KiB; ID=0x%x, Flash=%u KiB} $silicon $flash_kb]
    }
}
