# Only called after noinit. All hardware-facing commands below are replaced by fixtures.
set detach_handler [cpu cget -event gdb-detach]
if {[llength [info commands read_memory]]} { rename read_memory actual_read_memory }
if {[llength [info commands agrv]]} { rename agrv actual_agrv }
if {[llength [info commands flash]]} { rename flash actual_flash }
set fake_id 0x40200001
set fake_flash 0x40000
set fake_logic 0x80027000
set fake_protection off
proc read_memory {address width count} {
    if {$address == 0x03000100} { return [list $::fake_id] }
    if {$address == 0x81000030} { return [list $::fake_logic [expr {0xffffffff ^ $::fake_logic}]] }
    error "Unexpected hardware read"
}
proc agrv {sub} {
    if {$sub ne "options_read"} { error "Unexpected agrv command" }
    return "read protection: $::fake_protection"
}
proc flash {sub args} {
    if {$sub eq "probe"} { return }
    if {$sub eq "list"} { return [list [list base 0x80000000 size $::fake_flash]] }
    error "Unexpected flash write"
}
studiox_check_target
set fake_id 0
if {![catch {studiox_check_target}]} { error "ID protection failed" }
set fake_id 0x40200001
set fake_flash 0x80000
if {![catch {studiox_check_target}]} { error "Flash capacity protection failed" }
set fake_flash 0x40000
set fake_logic 0x80026000
if {![catch {studiox_check_target}]} { error "Logic partition protection failed" }
set fake_logic 0x80027000
set fake_protection on
if {![catch {studiox_check_target}]} { error "Read protection guard failed" }
set fake_protection off
studiox_check_target

if {[llength [info commands mww]]} { rename mww actual_mww }
if {[llength [info commands poll]]} { rename poll actual_poll }
if {[llength [info commands resume]]} { rename resume actual_resume }
if {[llength [info commands cpu]]} { rename cpu actual_cpu }
set fake_state halted
set fake_resume_working 1
set fake_restored 0
set fake_poll_on 0
proc mww {address value} {
    if {$address != 0x0300001c || $value != 0x1230} { error "Debug control not restored" }
    set ::fake_restored 1
}
proc poll {args} { if {$args eq "on"} { set ::fake_poll_on 1 } }
proc resume {} { if {$::fake_resume_working} { set ::fake_state running } }
proc cpu {sub} {
    if {$sub ne "curstate"} { error "Unexpected target command" }
    return $::fake_state
}
set STUDIOX_AG32_DEBUG_CONTROL 0x1230
eval $detach_handler
if {!$fake_restored || !$fake_poll_on || [info exists STUDIOX_AG32_DEBUG_CONTROL]} { error "Detach cleanup failed" }
set fake_state halted
set fake_resume_working 0
if {![catch {eval $detach_handler}]} { error "Failed resume was reported as successful" }
echo AG32_OFFLINE_CHECKS_OK
shutdown
